# Fly.io config. `fly launch --copy-config` will ask for a unique app name.
app = "movie-picker"
primary_region = "arn"   # Stockholm, closest to Denmark

[build]

[env]
  NODE_ENV = "production"
  PORT = "3001"
  DB_FILE = "/data/movie-picker.db"
  COOKIE_SECURE = "true"
  TMDB_REGION = "DK"

[mounts]
  source = "movie_picker_data"
  destination = "/data"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/config"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
